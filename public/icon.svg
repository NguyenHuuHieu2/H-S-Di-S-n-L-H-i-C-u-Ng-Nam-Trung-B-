<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Outer Sacred Border -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Whale Tail & Dragon Crest Symbol (Đức Ngư Ông) -->
  <path d="M256 120 C230 180 160 210 130 190 C120 184 116 195 125 205 C160 245 220 250 250 310 C254 318 258 318 262 310 C292 250 352 245 387 205 C396 195 392 184 382 190 C352 210 282 180 256 120 Z" fill="url(#gold)" />
  
  <!-- Ocean Waves (Ba Đào Thủy Ba) -->
  <path d="M120 340 C140 330 165 330 185 342 C205 354 230 354 250 342 C270 330 295 330 315 342 C335 354 360 354 392 340" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round"/>
  <path d="M140 375 C160 365 180 365 200 375 C220 385 240 385 260 375 C280 365 300 365 320 375 C340 385 360 385 372 375" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Oarsmen Paddle (Dầm Trạo) Cross -->
  <rect x="249" y="270" width="14" height="135" rx="7" fill="url(#gold)"/>
  <ellipse cx="256" cy="400" rx="20" ry="12" fill="url(#gold)"/>
</svg>
